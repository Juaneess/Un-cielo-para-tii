<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una Sorpresa para Ti ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #100b22;
      font-family: sans-serif;
    }

    /* Fondo Gradiente Atardecer Animado */
    .sky {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, 
        #1d2440 0%, 
        #3d2852 25%, 
        #703358 50%, 
        #aa3a52 70%, 
        #db5b43 85%, 
        #f4a247 100%
      );
      background-size: 100% 120%;
      animation: skyShift 12s ease-in-out infinite alternate;
      overflow: hidden;
    }

    @keyframes skyShift {
      0% { background-position: 0% 0%; }
      100% { background-position: 0% 100%; }
    }

    /* Sol brillante con resplandor cálido */
    .sun {
      position: absolute;
      bottom: 23%;
      left: 20%;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #fffaee 30%, #ffd891 70%, rgba(244, 162, 71, 0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 50px #f4a247, 0 0 100px #eb6b40;
      animation: sunGlow 3.5s ease-in-out infinite alternate;
    }

    @keyframes sunGlow {
      0% { transform: scale(1); box-shadow: 0 0 40px #f4a247, 0 0 80px #eb6b40; }
      100% { transform: scale(1.06); box-shadow: 0 0 65px #f4a247, 0 0 120px #eb6b40; }
    }

    /* Nubes suaves con movimiento constante */
    .cloud {
      position: absolute;
      background: rgba(255, 235, 240, 0.65);
      border-radius: 50px;
      filter: blur(1px);
      animation: floatCloud linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }

    .cloud-1 { width: 180px; height: 45px; top: 12%; left: -200px; animation-duration: 35s; }
    .cloud-1::before { width: 70px; height: 70px; top: -30px; left: 25px; }
    .cloud-1::after { width: 50px; height: 50px; top: -20px; right: 25px; }

    .cloud-2 { width: 220px; height: 50px; top: 28%; left: -250px; animation-duration: 48s; animation-delay: 12s; }
    .cloud-2::before { width: 85px; height: 85px; top: -38px; left: 30px; }
    .cloud-2::after { width: 60px; height: 60px; top: -25px; right: 30px; }

    @keyframes floatCloud {
      from { transform: translateX(-300px); }
      to { transform: translateX(calc(100vw + 300px)); }
    }

    /* Destellos / Estrellitas románticas en el cielo */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px #fff;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(0.6); }
      100% { opacity: 0.9; transform: scale(1.4); }
    }

    /* Colina verde estilo Peanuts */
    .hill {
      position: absolute;
      bottom: -110px;
      left: -10%;
      width: 120%;
      height: 320px;
      background: linear-gradient(to bottom, #3f5927 0%, #1c2e0f 100%);
      border-top-left-radius: 50% 130px;
      border-top-right-radius: 50% 130px;
      border-top: 4px solid #14220a;
      z-index: 5;
    }

    /* Silla de madera bien apoyada en la hierba */
    .chair {
      position: absolute;
      bottom: 172px;
      left: 50%;
      transform: translateX(-50%);
      width: 65px;
      height: 85px;
      z-index: 6;
    }

    /* --- CONTENEDOR Y ANIMACIÓN DE SNOOPY --- */
    .snoopy-box {
      position: absolute;
      /* Ajustado exactamente al nivel del suelo de la colina */
      bottom: 178px; 
      left: -120px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: left 0.1s linear;
    }

    /* Caminata natural con bamboleo realista */
    .walking {
      animation: walkToChair 8s linear forwards, naturalStep 0.45s ease-in-out infinite alternate;
    }

    @keyframes walkToChair {
      0% { left: -120px; }
      100% { left: calc(50% - 38px); }
    }

    /* Paso de caminata: simula apoyar las patas y elevar el cuerpo */
    @keyframes naturalStep {
      0% { transform: translateY(0px) rotate(-1.5deg); }
      100% { transform: translateY(-4px) rotate(1.5deg); }
    }

    /* Estado sentado fijo */
    .seated {
      left: calc(50% - 38px);
      animation: none;
      transform: translateY(0) rotate(0deg);
    }

    /* Imagen PNG de Snoopy */
    .snoopy-img {
      width: 75px;
      height: auto;
      filter: drop-shadow(0px 3px 3px rgba(0,0,0,0.25));
    }

    /* Corazón animado sobre la cabeza */
    .heart-icon {
      font-size: 26px;
      opacity: 0;
      transform: scale(0.3);
      margin-bottom: 4px;
      transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .heart-icon.show {
      opacity: 1;
      transform: scale(1.2);
      animation: heartBeat 1.3s ease-in-out infinite alternate;
    }

    @keyframes heartBeat {
      0% { transform: translateY(0px) scale(1.1); }
      100% { transform: translateY(-9px) scale(1.35); }
    }

    /* Sonrojo tierno en las mejillas */
    .blush {
      position: absolute;
      bottom: 38px;
      width: 36px;
      height: 10px;
      background: rgba(255, 77, 109, 0.6);
      border-radius: 10px;
      filter: blur(3px);
      opacity: 0;
      transition: opacity 1s ease;
    }

    .blush.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="sky">
    <!-- Sol y Estrellas -->
    <div class="sun"></div>
    <div class="sparkle" style="top: 15%; left: 30%; animation-delay: 0.2s;"></div>
    <div class="sparkle" style="top: 22%; left: 75%; animation-delay: 0.8s;"></div>
    <div class="sparkle" style="top: 10%; left: 60%; animation-delay: 1.4s;"></div>

    <!-- Nubes -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- Silla de Madera -->
    <div class="chair">
      <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="8" height="45" rx="3" fill="#8d5b4c" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="42" y="10" width="8" height="45" rx="3" fill="#8d5b4c" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="10" y="15" width="40" height="8" rx="2" fill="#a06c5b" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="10" y="28" width="40" height="8" rx="2" fill="#a06c5b" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="5" y="48" width="50" height="8" rx="2" fill="#b87d68" stroke="#2b2b2b" stroke-width="3"/>
        <rect x="10" y="54" width="7" height="24" fill="#6d4336" stroke="#2b2b2b" stroke-width="2.5"/>
        <rect x="43" y="54" width="7" height="24" fill="#6d4336" stroke="#2b2b2b" stroke-width="2.5"/>
      </svg>
    </div>

    <!-- Contenedor Snoopy -->
    <div class="snoopy-box walking" id="snoopyBox">
      <!-- Corazón arriba -->
      <div class="heart-icon" id="heart">❤️</div>
      
      <!-- Snoopy PNG -->
      <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Snoopy_Peanuts.png" alt="Snoopy" class="snoopy-img">
      
      <!-- Sonrojo -->
      <div class="blush" id="blush"></div>
    </div>

    <!-- Colina verde -->
    <div class="hill"></div>
  </div>

  <script>
    const snoopyBox = document.getElementById('snoopyBox');
    const heart = document.getElementById('heart');
    const blush = document.getElementById('blush');

    // Transición de la caminata a sentarse
    snoopyBox.addEventListener('animationend', (e) => {
      if (e.animationName === 'walkToChair') {
        snoopyBox.classList.remove('walking');
        snoopyBox.classList.add('seated');

        // Pausa para ponerse nervioso de amor
        setTimeout(() => {
          heart.classList.add('show');
          blush.classList.add('show');
        }, 600);
      }
    });
  </script>
</body>
</html>
